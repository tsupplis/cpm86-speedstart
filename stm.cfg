# SpeedStart CP/M-86: IBM XT, 8088, 640K RAM and CGA.
# ./stm supplies rom/ and a private disk.imd in the session directory.
path = "rom"

system {
    model = "5160"
    boot = 0
    rtc = 1
    memtest = 0
    floppy_disk_drives = 1
    patch_bios_init = 1
    patch_bios_int19 = 1
}

cpu {
    model = "8088"
    speed = 16
}

ram {
    address = 0
    size = 640K
}

rom {
    address = 0xf0000
    size = 64K
}

load {
    format = "binary"
    address = 0xfe000
    file = "ibm-xt-1982-11-08.rom"
}

load {
    format = "binary"
    address = 0xf6000
    file = "ibm-basic-1.10.rom"
}

load {
    format = "binary"
    address = 0xf0000
    file = "ibmpc-pcex.rom"
}

terminal {
    driver = "sdl"
    escape = "F12"
    scale = 1
}

video {
    device = "cga"
    font = 1
    blink = 30
}

fdc {
    address = 0x3f0
    irq = 6
    drive0 = 0
    accurate = 0
    ignore_eot = 1
}

disk {
    drive = 0
    type = "auto"
    file = "disk.imd"
    optional = 0
}
